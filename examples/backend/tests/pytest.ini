[pytest]
# 测试目录
testpaths = tests/sit tests/uat

# 文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认命令行选项（暂时禁用 timeout，避免与 xdist 冲突）
addopts = -v --strict-markers --tb=short

# 标记定义
markers =
    sit: SIT 系统集成测试
    uat: UAT 用户验收测试
    quick: 快速测试（< 30 秒）
    standard: 标准测试（30 秒 - 2 分钟）
    slow: 慢速测试（2 分钟 - 10 分钟）
    ultra_slow: 超慢测试（> 10 分钟）
    k8s: K8s 相关测试
    database: 数据库相关测试
    optional: 可选测试
    gpu_product: GPU 产品提取测试（环境限制：需要 RTX 3090/A100/H100 节点）
    environment_limited: 测试受环境限制，代码逻辑已正确实现（不影响发布）
    sanity: Sanity 回归测试（每 6 小时执行，快速检测关键问题，STORY-15-23 新增）
    bug_detection: Bug 检测测试（检测数据质量异常）
    trace: 主追溯(定位符 story/epic/endpoint + 版本化源锚 design)。一测一主功能锚;详见 qa/references/test_traceability.md

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# pytest-timeout 配置
# 全局超时（秒），默认 120 秒（2 分钟）
timeout = 120
# 超时方法：thread（线程方式，不中断测试）或 signal（信号方式，中断测试）
timeout_method = thread
