# 测试环境配置（独立测试实例）
# ⚠️ 重要：此配置用于独立的测试环境，不影响生产环境

Name: ExampleService.api.test
Host: 0.0.0.0
Port: 8083  # ⚠️ 使用不同的端口（生产: 8082）
Timeout: 200000

# 日志配置（测试环境）
LogConf:
  ServiceName: ExampleService-Test
  Mode: file
  Path: log/test  # ⚠️ 使用独立的日志目录
  Level: info
  Compress: false
  KeepDays: 3
  StackCooldownMillis: 100
  # K8s 事件日志独立配置
  K8sEventLogLevel: debug  # K8s 事件日志级别 (debug, info)
  K8sEventLogPath: log/test/k8s-events.log  # K8s 事件独立日志文件路径

# Redis 配置（测试环境，禁用）
RedisConf:
  Host: localhost:6379
  Pass: ""
  DB: 1  # ⚠️ 使用不同的 Redis DB（生产: 0）
  Enabled: false

# 数据库配置（测试数据库 - 独立实例）
# ⚠️ 重要：使用独立的测试数据库，不影响生产数据库
DatabaseConf:
  Type: postgres
  Host: localhost  # ⚠️ 连接独立测试数据库
  Port: 15432      # ⚠️ 测试数据库端口（生产: 5432）
  DBName: event_db_test  # ⚠️ 测试数据库名（生产: event_db-dev）
  Username: postgres
  Password: postgres

# K8s 配置（测试环境 - 使用生产集群）
# ⚠️ 注意：测试时会监听生产 K8s 集群事件，但只写入测试数据库
Kubeconfig:
  # 使用 kubeconfig 文件进行认证（推荐用于 Docker 开发环境）
  K8sKubeconfigPath: "/path/to/kubeconfig"
  # 以下字段留空，使用 kubeconfig 文件中的配置
  K8sApiServerUrl: ""
  K8sBearerToken: ""
  K8sCaFilePath: ""
  DevPodNamespace: "example-service"

# 时区配置（服务层统一使用 UTC+8）
TimezoneConf:
  Timezone: "Asia/Shanghai"

# TTL 清理定时任务配置（STORY-15-22）
# ⚠️ AC-14/AC-15 (2026-04-14): 测试环境配置优化
CronConf:
  Enabled: true                       # 是否启用定时任务
  Timezone: "Asia/Shanghai"           # 时区配置

  # Cron 表达式（测试环境：每 5 分钟执行，便于快速验证）
  CleanupHistory: "*/5 * * * *"       # history 表清理 cron 表达式（生产：0 2 * * *）
  CleanupStatus: "*/5 * * * *"        # status 表清理 cron 表达式（生产：0 3 * * *）
  CleanupDimMetric: "*/5 * * * *"     # dim_metric 表清理 cron 表达式（生产：0 4 * * *）

  # ⭐ AC-15: TTL 阈值配置（测试环境：较短 TTL，便于快速验证）
  # 格式: Postgres INTERVAL 语法
  CleanupHistoryTTL: "7 days"         # history 表 TTL（生产：30 days）
  CleanupStatusTTL: "7 days"          # status 表 TTL（生产：30 days）
  CleanupDimMetricTTL: "30 days"      # dim_metric 表 TTL（生产：90 days）
