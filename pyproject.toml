[project]
name = "{PROJECT_NAME}"
version = "0.1.0"
description = "Resource Meter - Kubernetes GPU Usage Statistics Platform"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.4.0",
    "pytest-html>=3.2.0",
    "pytest-json-report>=1.5.0",
    "kubernetes>=27.0.0",
    "psycopg2-binary>=2.9.7",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-timeout>=2.1.0",
    "pytest-rerunfailures>=13.0",
]

[tool.uv]
default-groups = []

# 注意：本项目不输出任何 Python dist
# pyproject.toml 仅用于 uv 依赖管理
