<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prototype - Mobile App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Phone frame */
    .phone {
      width: 390px;
      height: 844px;
      background: #f2f2f7;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      margin: 20px 0;
      display: flex;
      flex-direction: column;
    }

    /* Status bar */
    .status-bar {
      height: 54px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Header */
    .page-header {
      padding: 4px 20px 16px;
    }
    .page-header h1 { font-size: 2rem; font-weight: 700; }
    .page-header p { font-size: 0.85rem; color: #8e8e93; margin-top: 2px; }

    /* Search */
    .search-bar {
      margin: 0 20px 16px;
      padding: 10px 14px;
      background: rgba(118,118,128,0.12);
      border-radius: 10px;
      font-size: 0.9rem;
      color: #8e8e93;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Scrollable content */
    .content { flex: 1; overflow-y: auto; padding: 0 20px; }

    /* Horizontal card scroll */
    .h-scroll-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
    .h-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 24px;
      -webkit-overflow-scrolling: touch;
    }
    .h-scroll::-webkit-scrollbar { display: none; }
    .card-sm {
      min-width: 160px;
      border-radius: 16px;
      padding: 16px;
      color: white;
      flex-shrink: 0;
    }
    .card-sm h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .card-sm p { font-size: 0.75rem; opacity: 0.85; }
    .card-sm .card-value { font-size: 1.75rem; font-weight: 700; margin: 8px 0 4px; }
    .bg-blue { background: linear-gradient(135deg, #007aff, #5856d6); }
    .bg-green { background: linear-gradient(135deg, #34c759, #30d158); }
    .bg-orange { background: linear-gradient(135deg, #ff9500, #ff6b00); }
    .bg-pink { background: linear-gradient(135deg, #ff2d55, #af52de); }

    /* List items */
    .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
    .list-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #f2f2f7;
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:active { background: #f2f2f7; }
    .list-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .list-info { flex: 1; }
    .list-info h4 { font-size: 0.95rem; font-weight: 500; }
    .list-info p { font-size: 0.8rem; color: #8e8e93; margin-top: 1px; }
    .list-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge-new { background: #dcfce7; color: #166534; }
    .badge-hot { background: #fee2e2; color: #991b1b; }
    .badge-updated { background: #dbeafe; color: #1e40af; }

    /* Bottom tab bar */
    .tab-bar {
      height: 83px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 8px;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .tab-item:active { opacity: 0.5; }
    .tab-icon { font-size: 1.4rem; }
    .tab-label { font-size: 0.65rem; color: #8e8e93; }
    .tab-item.active .tab-label { color: #007aff; }

    /* Animations */
    .fade-in { animation: fadeIn 0.4s ease both; }
    .fade-in:nth-child(2) { animation-delay: 0.05s; }
    .fade-in:nth-child(3) { animation-delay: 0.1s; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>ⓘ ▋▋▋ 🔋</span>
  </div>

  <div class="page-header fade-in">
    <h1>工作台</h1>
    <p>今天有 3 个待办事项</p>
  </div>

  <div class="search-bar fade-in">🔍 搜索项目、任务...</div>

  <div class="content">
    <div class="h-scroll-title fade-in">项目概览</div>
    <div class="h-scroll">
      <div class="card-sm bg-blue">
        <h3>CI/CD</h3>
        <div class="card-value">98%</div>
        <p>构建成功率</p>
      </div>
      <div class="card-sm bg-green">
        <h3>测试</h3>
        <div class="card-value">87%</div>
        <p>代码覆盖率</p>
      </div>
      <div class="card-sm bg-orange">
        <h3>待处理</h3>
        <div class="card-value">12</div>
        <p>待审查 MR</p>
      </div>
      <div class="card-sm bg-pink">
        <h3>发布</h3>
        <div class="card-value">v2.3</div>
        <p>最新版本</p>
      </div>
    </div>

    <div class="section-title fade-in">最近动态</div>
    <div class="list-card">
      <div class="list-item">
        <div class="list-avatar" style="background:#dbeafe">🔀</div>
        <div class="list-info">
          <h4>feat: 添加用户认证</h4>
          <p>张三 · 10 分钟前</p>
        </div>
        <span class="list-badge badge-new">新</span>
      </div>
      <div class="list-item">
        <div class="list-avatar" style="background:#dcfce7">✅</div>
        <div class="list-info">
          <h4>Pipeline #128 构建成功</h4>
          <p>CI Bot · 25 分钟前</p>
        </div>
        <span class="list-badge badge-updated">已更新</span>
      </div>
      <div class="list-item">
        <div class="list-avatar" style="background:#fef3c7">📦</div>
        <div class="list-info">
          <h4>v2.3.1 发布到 JFrog</h4>
          <p>李四 · 1 小时前</p>
        </div>
        <span class="list-badge badge-hot">热</span>
      </div>
      <div class="list-item">
        <div class="list-avatar" style="background:#fee2e2">🐛</div>
        <div class="list-info">
          <h4>fix: 修复分页查询参数</h4>
          <p>王五 · 2 小时前</p>
        </div>
        <span class="list-badge badge-updated">已更新</span>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active"><span class="tab-icon">🏠</span><span class="tab-label">首页</span></div>
    <div class="tab-item"><span class="tab-icon">📋</span><span class="tab-label">项目</span></div>
    <div class="tab-item"><span class="tab-icon">🔔</span><span class="tab-label">通知</span></div>
    <div class="tab-item"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
  </div>
</div>

<script>
// Tab switching
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});
</script>
</body>
</html>
